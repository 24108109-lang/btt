<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang web responsive giới thiệu những địa điểm du lịch yêu thích của Phương Thảo.">
  <title>Những điểm đến yêu thích | Tang Thi Phuong Thao</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Những điểm đến yêu thích</h1>
    <p class="intro">Xin chào! Mình là Phương Thảo. Đây là một vài địa điểm mình muốn khám phá và lưu giữ những kỷ niệm đẹp.</p>
  </header>

  <main class="gallery" aria-label="Bộ sưu tập địa điểm du lịch">
    <figure>
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85" alt="Thung lũng xanh rộng lớn dưới bầu trời nhiều mây">
      <figcaption><h2>Thiên nhiên xanh</h2><p>Mình thích đi bộ giữa thiên nhiên để thư giãn, hít thở không khí trong lành và tạm rời xa nhịp sống bận rộn.</p></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85" alt="Những tòa nhà thành phố sáng đèn vào buổi tối">
      <figcaption><h2>Thành phố về đêm</h2><p>Ánh đèn và những con phố nhộn nhịp khiến thành phố trở nên sống động. Mình muốn khám phá các khu phố mới và thử món ăn địa phương.</p></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85" alt="Bãi biển xanh với cát sáng màu và những con sóng nhẹ">
      <figcaption><h2>Biển xanh</h2><p>Một chuyến đi biển là cơ hội để nghỉ ngơi, ngắm bình minh và dành thời gian vui vẻ cùng gia đình hoặc bạn bè.</p></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=85" alt="Kiến trúc của một công trình nổi bật trong thành phố">
      <figcaption><h2>Kiến trúc độc đáo</h2><p>Mình thích tìm hiểu câu chuyện phía sau những công trình nổi tiếng và chụp ảnh các chi tiết kiến trúc thú vị.</p></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85" alt="Dãy núi cao với những đỉnh núi phủ tuyết">
      <figcaption><h2>Chinh phục núi cao</h2><p>Khung cảnh núi non nhắc mình kiên trì và bước từng bước nhỏ để đạt được mục tiêu. Đây là trải nghiệm mình muốn thử trong tương lai.</p></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=85" alt="Ngôi làng ven biển với những ngôi nhà nhiều màu sắc">
      <figcaption><h2>Làng ven biển</h2><p>Mình muốn ghé thăm những ngôi làng yên bình, thưởng thức món ăn truyền thống và tìm hiểu văn hóa của người dân địa phương.</p></figcaption>
    </figure>
  </main>

  <footer>
    <p>Trang web học tập Responsive Design · Tang Thi Phuong Thao</p>
  </footer>
</body>
</html>
